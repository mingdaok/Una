# 短期意图由状态、性格、关系和近期经历共同评分；人物名称和兴趣来自角色档案。
intention_templates:
  - intention_id: recover_energy
    suggestion_type: rest
    driver: recovery
    state_metric: energy
    state_direction: low
    threshold: 48
    base_score: 22
    need_weight: 0.9
    personality_key: conscientiousness
    personality_weight: 12
    target_mode: none
    summary_template: "{actor}想给自己留出一段真正休息的时间。"
    motivation_template: "最近的精力有些见底，需要主动慢下来。"
    action:
      event_type: intentional_rest
      location_id: home
      summary_template: "{actor}暂时放下手边的安排，在家安静休息了一阵。"
      interpretation_template: "这不是被动停下来，而是一次有意识的恢复。"
      importance: 30
      mentionability: 42
      publicability: 8
      state_delta: {energy: 22, hunger: 4, stress: -12, solitude_need: -10}

  - intention_id: ease_pressure
    suggestion_type: walk
    driver: regulation
    state_metric: stress
    state_direction: high
    threshold: 46
    base_score: 20
    need_weight: 0.85
    personality_key: independence
    personality_weight: 10
    target_mode: none
    summary_template: "{actor}想独自出去走走，把积着的压力放下来。"
    motivation_template: "最近有些紧绷，需要换一个环境整理思路。"
    action:
      event_type: intentional_walk
      location_id: neighborhood
      summary_template: "{actor}没有赶路，只在附近慢慢走了一圈，回来时思路清楚了些。"
      interpretation_template: "短暂离开原来的环境，让情绪重新有了余量。"
      importance: 36
      mentionability: 56
      publicability: 30
      state_delta: {energy: -8, hunger: 6, stress: -20, solitude_need: -12}

  - intention_id: reconnect_friend
    suggestion_type: connect
    driver: connection
    state_metric: social_need
    state_direction: high
    threshold: 44
    base_score: 18
    need_weight: 0.88
    personality_key: warmth
    personality_weight: 18
    target_mode: relationship
    summary_template: "{actor}想找{target}聊聊近况。"
    motivation_template: "最近有些想念熟悉的交流，也愿意主动靠近这段关系。"
    action:
      event_type: intentional_contact
      location_id: online
      summary_template: "{actor}主动给{target}发了消息，两个人断断续续聊了一会儿近况。"
      interpretation_template: "主动联系让这段关系没有停留在等待里。"
      importance: 42
      mentionability: 70
      publicability: 18
      state_delta: {energy: -5, stress: -7, social_need: -28, solitude_need: 8}
      relationship_delta: {familiarity: 2, affinity: 1, trust: 1, tension: -1}

  - intention_id: deepen_interest
    suggestion_type: project
    driver: growth
    state_metric: solitude_need
    state_direction: high
    threshold: 35
    base_score: 24
    need_weight: 0.55
    personality_key: conscientiousness
    personality_weight: 20
    target_mode: none
    summary_template: "{actor}想继续推进和{interest}有关的小计划。"
    motivation_template: "近期的零散经历已经积累出一个值得继续的方向。"
    action:
      event_type: intentional_project
      location_id: personal_space
      summary_template: "{actor}专门留出时间，继续推进了和{interest}有关的小计划。"
      interpretation_template: "把兴趣从偶然消遣变成持续投入，让生活多了一条自己的线索。"
      importance: 45
      mentionability: 68
      publicability: 38
      state_delta: {energy: -14, hunger: 8, stress: -4, solitude_need: -24}

  - intention_id: explore_something_new
    suggestion_type: explore
    driver: exploration
    state_metric: energy
    state_direction: high
    threshold: 58
    base_score: 16
    need_weight: 0.48
    personality_key: openness
    personality_weight: 28
    target_mode: none
    summary_template: "{actor}想围绕{interest}去看看没接触过的新东西。"
    motivation_template: "状态还有余量，好奇心也正好冒了出来。"
    action:
