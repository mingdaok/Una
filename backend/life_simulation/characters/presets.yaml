schema_version: 1

relationship_policy:
  tension_strained_threshold: 45
  conflict_trigger_tension: 38
  conflict_probability_percent: 32
  repair_trigger_tension: 24
  repair_min_trust: 18
  tiers:
    - {key: distant, min_closeness: 0, disclosure_level: public}
    - {key: familiar, min_closeness: 15, disclosure_level: familiar}
    - {key: close, min_closeness: 40, disclosure_level: close}
    - {key: trusted, min_closeness: 65, disclosure_level: trusted}

action_atoms:
  sleep:
    categories: [recovery, quiet]
    allowed_locations: [home]
    duration_minutes: [180, 540]
    base_effect: {energy: 44, stress: -20, boredom: 4}
    requirements: {}
    window_keys: [night]
    summary_templates:
      - 比平时更早放下手边的事，在家好好睡了一觉。
  rest:
    categories: [recovery, quiet]
    allowed_locations: [home]
    duration_minutes: [20, 90]
    base_effect: {energy: 18, stress: -14, solitude_need: -8}
    requirements: {}
    window_keys: [morning, forenoon, noon, afternoon, evening]
    summary_templates:
      - 临时把节奏放慢，在家安静休息了一会儿。
      - 没有勉强自己继续忙，留在家恢复了一些精神。
  meal:
    categories: [meal, routine]
    allowed_locations: [home, neighborhood_cafe, old_street_market]
    duration_minutes: [25, 75]
    base_cost: {energy: 3}
    base_effect: {hunger: -48, comfort: 8}
    requirements: {}
    window_keys: [morning, forenoon, noon, afternoon, evening]
    summary_templates:
      - 在{location}认真吃了顿饭，也顺便让自己慢下来。
      - 去了{location}找些合胃口的东西，填饱肚子后才继续安排时间。
  explore:
    categories: [novelty, exploration, outdoor]
    allowed_locations: [old_bookstore, old_town, riverside, south_bridge]
    duration_minutes: [40, 150]
    base_cost: {energy: 12}
    base_effect: {boredom: -26, confidence: 4}
    requirements: {min_energy: 25}
    window_keys: [morning, forenoon, noon, afternoon, evening]
    summary_templates:
      - 去了{location}随意走走，途中留意了些和{interest}有关的新鲜细节。
      - 临时绕到{location}，没有赶行程，只顺着对{interest}的好奇慢慢看。
  connect:
    categories: [social]
    allowed_locations: [online, neighborhood_cafe]
    duration_minutes: [5, 60]
    base_cost: {energy: 4}
    base_effect: {social_need: -24, confidence: 3}
    requirements: {min_confidence: 20}
    required_resources: [phone]
    window_keys: [morning, forenoon, noon, afternoon, evening]
    summary_templates:
      - 主动联系了一位熟悉的人，聊了几句最近和{interest}有关的事。
      - 想起有阵子没联系的人，便发去一条不催回复的消息。
  focus_project:
    categories: [productive, goal]
    allowed_locations: [home, studio, workshop]
    duration_minutes: [30, 150]
    base_cost: {energy: 12, stress: 4}
    base_effect: {boredom: -12, confidence: 6, focus: -8}
    requirements: {min_focus: 35, min_energy: 28}
    window_keys: [morning, forenoon, noon, afternoon, evening]
    summary_templates:
      - 在{location}集中处理了一阵和{interest}有关的小项目，留下了可以继续推进的进度。
      - 趁注意力还在，在{location}把{interest}相关的想法往前推了一小步。

# NPC 自主生活的活动素材集中在这里。业务代码只读取模板，不识别具体人物姓名。
