# 共同事件模板只使用角色占位符，不绑定当前显示名称。
interaction_templates:
  - interaction_id: quiet_cafe_catchup
    kind: supportive
    event_type: npc_meetup
    location_id: neighborhood_cafe
    summary_template: "{actor_a}和{actor_b}在附近坐了一会儿，交换了最近各自在忙的事情。"
    perspectives:
      actor_a:
        interpretation: 这次没有特别目的的见面，让彼此的近况重新接上了。
        private_thought: 对方记得上次随口提过的细节，感觉很好。
      actor_b:
        interpretation: 轻松交流让这段关系比之前自然了一点。
        private_thought: 下次可以把那件还没想清楚的事也说说。
    importance: 40
    mentionability: 68
    publicability: 34
    relationship_delta: {familiarity: 3, affinity: 2, trust: 1, tension: -1}

  - interaction_id: old_town_detour
    kind: supportive
    event_type: shared_city_walk
    location_id: old_town
    summary_template: "{actor_a}和{actor_b}临时绕去旧城区走了一段，还互相指出了各自在意的小店和街景。"
    perspectives:
      actor_a:
        interpretation: 同一段路被另一个人看见后，出现了自己原本会错过的部分。
        private_thought: 原来对方会注意到这种不起眼的地方。
      actor_b:
        interpretation: 一起绕路比按计划赶回去更值得记住。
        private_thought: 下次也许可以再走远一点。
    importance: 43
    mentionability: 72
    publicability: 48
    relationship_delta: {familiarity: 3, affinity: 3, trust: 1, tension: -1}

  - interaction_id: practical_help
    kind: supportive
    event_type: mutual_help
    location_id: neighborhood
    summary_template: "{actor_a}顺手帮{actor_b}处理了一件卡住的小事，两个人后来又聊了一会儿。"
    perspectives:
      actor_a:
        interpretation: 能实际帮上忙，比只说安慰的话更踏实。
        private_thought: 这件事没有想象中麻烦，还好今天碰上了。
      actor_b:
        interpretation: 被认真回应让这段关系多了一点可以依靠的感觉。
        private_thought: 下次对方需要帮忙时，我也会记得。
    importance: 46
    mentionability: 70
    publicability: 24
    relationship_delta: {familiarity: 2, affinity: 2, trust: 3, obligation: 1, tension: -1}

  - interaction_id: crossed_signals
    kind: conflict
    min_tension: 38
    event_type: relationship_friction
    location_id: neighborhood_cafe
    summary_template: "{actor_a}和{actor_b}聊到最近的一件事时理解出现了偏差，谈话比预想中更早结束。"
    perspectives:
      actor_a:
        interpretation: "对方的回应没有接住自己真正想表达的部分，气氛因此变得有些僵。"
        private_thought: "也许我刚才说得太快，但现在还不想立刻解释。"
      actor_b:
        interpretation: "原本普通的话题突然多了一层压力，自己也没找到合适的回应。"
        private_thought: "我不确定问题出在哪里，需要先想一想。"
    importance: 48
    mentionability: 46
    publicability: 4
    relationship_delta: {familiarity: 1, affinity: -4, trust: -3, tension: 12}

  - interaction_id: careful_repair
    kind: repair
    min_tension: 24
    min_trust: 18
    event_type: relationship_repair
    location_id: neighborhood
    summary_template: "{actor_a}和{actor_b}重新谈起上次没有说清楚的部分，各自补上了当时没能表达的话。"
    perspectives:
      actor_a:
        interpretation: "主动把话说清楚并不轻松，但至少不再让猜测替代对方的真实意思。"
        private_thought: "还没有完全恢复，不过我愿意再往前走一点。"
      actor_b:
        interpretation: "这次交流没有要求立刻回到从前，而是先确认彼此仍然在意这段关系。"
        private_thought: "对方愿意回来谈，本身已经是一种答案。"
    importance: 55
    mentionability: 52
    publicability: 6
    relationship_delta: {familiarity: 2, affinity: 3, trust: 5, tension: -16}

